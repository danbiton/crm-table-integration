name: Backend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  ACR_NAME: dimriresidentsregistry
  REGISTRY: dimriresidentsregistry.azurecr.io
  IMAGE_NAME: dimri-backend
  RESOURCE_GROUP: rg-dimri-integrations
  CONTAINER_APP: dimri-backend-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Azure Login (PRODUCTION WAY)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login to ACR
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:latest \
            ./backend

      # 5. Push Docker image
      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest

      # 6. Deploy to Azure Container Apps
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE_NAME:latest